pre-commit:
  parallel: true
  commands:
    oxlint:
      glob: "**/*.{ts,tsx}"
      run: npx oxlint {staged_files}
    eslint:
      glob: "src/**/*.{ts,tsx}"
      run: npx eslint {staged_files}
    oxfmt:
      glob: "**/*.{ts,tsx,js,css,md,json,yml,yaml}"
      exclude:
        - package-lock.json
        - CHANGELOG.md
        - .release-please-manifest.json
      run: npx oxfmt {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    typecheck:
      run: npm run typecheck
    build:
      run: npm run build
