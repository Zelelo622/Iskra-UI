pre-commit:
  parallel: true
  commands:
    oxlint:
      glob: "**/*.{ts,tsx}"
      run: npx oxlint {staged_files}
    eslint:
      glob: "**/*.{ts,tsx}"
      run: npx eslint {staged_files}
    oxfmt:
      glob: "**/*.{ts,tsx,css,md,json}"
      run: npx oxfmt --check {staged_files}

commit-msg:
  commands:
    lint-commit-msg:
      run: npx commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    typecheck:
      run: npm run typecheck
    build:
      run: npm run build
